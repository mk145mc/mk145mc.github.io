<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mk145mc主页</title>
  <style>
    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      color: #24292f;
    }
    .jump-box {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 24px 0;
    }
    .jump-box select {
      flex: 1 1 260px;
      min-width: 200px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: #24292f;
      cursor: pointer;
    }
    .jump-box button {
      padding: 9px 20px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #0969da;
      color: #fff;
      transition: .15s;
    }
    .jump-box button:hover { background: #0860ca; }
    .jump-box button:disabled { background: #afb8c1; cursor: not-allowed; }
    .jump-tip { color: #cf222e; font-size: 14px; }
  </style>
</head>
<body>
  <h1>我的（开发）主页</h1>
  <h3>有生之年，还是多写点东西</h3>

  <!-- 选择器 + 按钮 -->
  <div class="jump-box">
    <select id="repoSelect">
      <option value="">加载中…</option>
    </select>
    <button id="goBtn" disabled>前往</button>
  </div>
  <p class="jump-tip" id="tip" hidden></p>

  <script>
  const select = document.getElementById('repoSelect');
  const btn    = document.getElementById('goBtn');
  const tip    = document.getElementById('tip');

  // 站点根地址：第二项没写 http 时会自动拼上它（换成你自己的域名）
  const BASE = 'https://mk145mc.github.io/';

  // 每条形如 ["名称", "链接或子项目名"]
  function parseRow(row) {
    if (Array.isArray(row)) {
      if (row.length < 2) return null;
      let url = String(row[1]).trim();
      // 不是完整链接就当作本站子项目，拼到站点根地址后面
      if (!/^https?:\/\//i.test(url)) url = BASE + url.replace(/^\/+/, '');
      return { name: String(row[0]).trim(), url };
    }
    // 容错：万一某条写成 "名称, 链接" 的字符串
    if (typeof row === 'string') {
      const i = row.indexOf(',');
      if (i === -1) return null;
      return { name: row.slice(0, i).trim(), url: row.slice(i + 1).trim() };
    }
    return null;
  }

  fetch('ser.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!Array.isArray(data)) throw new Error('ser.json 最外层必须是数组 [ ]');

      const items = data.map(parseRow).filter(x => x && x.url);
      if (!items.length) throw new Error('没有解析到任何条目');

      select.innerHTML = '';
      items.forEach(it => {
        const op = document.createElement('option');
        op.value = it.url;
        op.textContent = it.name;
        select.appendChild(op);
      });

      btn.disabled = false;
    })
    .catch(err => {
      select.innerHTML = '<option value="">加载失败</option>';
      tip.hidden = false;
      // 区分两类错误，避免提示误导
      if (err instanceof SyntaxError || /JSON|Unexpected|Expected/i.test(err.message)) {
        tip.textContent = 'ser.json 格式写错了：' + err.message +
          '。常见原因：数组里用了冒号 : 而不是逗号 , 分隔；或多写了一个尾逗号。';
      } else {
        tip.textContent = 'ser.json 加载失败：' + err.message +
          '。常见原因：本地直接双击打开 index.html 会被浏览器拦截（请用本地服务器预览）。';
      }
    });

  // 点击跳转
  btn.addEventListener('click', () => {
    const url = select.value;
    if (url) window.open(url, '_blank', 'noopener');  // 想在当前页跳转就换成 location.href = url
  });

  // 回车也能触发
  select.addEventListener('keydown', e => { if (e.key === 'Enter' && select.value) btn.click(); });

  // 想让"选中即跳转"、不用点按钮，取消下一行注释
  // select.addEventListener('change', () => btn.click());
  </script>
</body>
</html>
