<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mk145mc</title>
  <style>
    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      color: #24292f;
    }
    .jump-box {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 24px 0;
    }
    .jump-box select {
      flex: 1 1 260px;
      min-width: 200px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      color: #24292f;
      cursor: pointer;
    }
    .jump-box button {
      padding: 9px 20px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #0969da;
      color: #fff;
      transition: .15s;
    }
    .jump-box button:hover { background: #0860ca; }
    .jump-box button:disabled { background: #afb8c1; cursor: not-allowed; }
    .jump-tip { color: #cf222e; font-size: 14px; }
  </style>
</head>
<body>
  <h1>这里是个人主页</h1>

  <div class="jump-box">
    <select id="repoSelect">
      <option value="">加载中…</option>
    </select>
    <button id="goBtn" disabled>前往</button>
  </div>
  <p class="jump-tip" id="tip" hidden></p>

  <script>
  const select = document.getElementById('repoSelect');
  const btn    = document.getElementById('goBtn');
  const tip    = document.getElementById('tip');

  function parseRow(row) {
    if (Array.isArray(row)) {
      if (row.length < 2) return null;
      return { name: String(row[0]).trim(), url: String(row[1]).trim() };
    }

    if (typeof row === 'string') {
      const i = row.indexOf(',');
      if (i === -1) return null;
      return { name: row.slice(0, i).trim(), url: row.slice(i + 1).trim() };
    }
    return null;
  }

  fetch('ser.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!Array.isArray(data)) throw new Error('ser.json 最外层必须是数组 [ ]');

      const items = data.map(parseRow).filter(x => x && x.url);
      if (!items.length) throw new Error('没有解析到任何条目');

      select.innerHTML = '';
      items.forEach(it => {
        const op = document.createElement('option');
        op.value = it.url;
        op.textContent = it.name;
        select.appendChild(op);
      });

      btn.disabled = false;
    })
    .catch(err => {
      select.innerHTML = '<option value="">加载失败</option>';
      tip.hidden = false;
      tip.textContent = 'ser.json 加载失败：' + err.message +
        '（本地直接双击打开 index.html 会被浏览器拦截，请用本地服务器预览）';
    });


  btn.addEventListener('click', () => {
    const url = select.value;
    if (url) window.open(url, '_blank', 'noopener'); 
  });


  select.addEventListener('keydown', e => { if (e.key === 'Enter' && select.value) btn.click(); });


  </script>
</body>
</html>
